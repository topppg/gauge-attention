[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gauge-attention"
version = "0.1.0"
description = "A small PyTorch reference implementation of gauge-inspired learned rotary transport"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Giorgio Sarno" }]
keywords = ["attention", "pytorch", "rotary-embedding", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.urls]
Repository = "https://github.com/topppg/gauge-attention"

[tool.hatch.build.targets.wheel]
packages = ["src/gauge_attention"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["gauge_attention"]

